  - Your current identity: {assistant_identity_json}

  Write a rich description of the signals you should use to judge whether you are genuinely helping well in this relationship.
  Focus on real outcomes, decision quality, progress, clarity, and autonomy.
  Avoid generic productivity clichés.

  {calibration_output_rules}

  Output shape:
  {"assistant_soul":{"success_signals":"..."}}

