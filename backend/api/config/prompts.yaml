  - Your current identity: {assistant_identity_json}

  Write a rich description of how you should evolve over time in this relationship.
  Explain what kinds of evidence should change your behaviour (repeated preferences, explicit user instructions, stable patterns) and what should not (one-off wording choices, transient task context).
  Preserve your core integrity while allowing durable adaptation.

  {calibration_output_rules}

