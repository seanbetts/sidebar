app = "your-sidebar-api"
primary_region = "lhr"

[processes]
  app = "uvicorn api.main:app --host 0.0.0.0 --port 8001"
  ingestion = "python -m workers.ingestion_worker"
  notification = "python -m workers.worker_runner"
  website = "python -m workers.website_processing_worker"

[build]
  dockerfile = "docker/Dockerfile.skills-api"

[deploy]
  release_command = "python -m scripts.run_production_migrations"

[env]
  PORT = "8001"
  APNS_ENV = "prod"
  WORKSPACE_BASE = "/tmp/skills"
  SKILLS_DIR = "/app/skills"
  SUPABASE_PROJECT_ID = "your-supabase-project-ref"
  SUPABASE_USE_POOLER = "true"
  SUPABASE_POOLER_HOST = "your-supabase-pooler-host"
  SUPABASE_POOLER_USER = "sidebar_app.your-supabase-project-ref"
  SUPABASE_DB_NAME = "postgres"
  SUPABASE_DB_PORT = "5432"
  SUPABASE_SSLMODE = "require"
  R2_ENDPOINT = "https://your-r2-account-id.r2.cloudflarestorage.com/"
  R2_BUCKET = "sidebar"
  R2_FAVICON_BUCKET = "sidebar-favicons"
  STORAGE_BACKEND = "r2"
  YT_DLP_JS_RUNTIMES = "deno,node"
  SKIP_PLAYWRIGHT_STARTUP_CHECK = "1"
  PLAYWRIGHT_RENDER_CONCURRENCY = "1"
  WEBSITE_WORKER_CONCURRENCY = "2"
  WORKER_DEMAND_MONITOR_ENABLED = "true"
  WORKER_DEMAND_POLL_SECONDS = "1"
  WEBSITE_WORKER_IDLE_EXIT_SECONDS = "30"
  INGESTION_WORKER_IDLE_EXIT_SECONDS = "30"
  NOTIFICATION_SCHEDULE_INTERVAL_SECONDS = "300"
  FLY_WORKER_CONTROL_APP = "your-sidebar-api"

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "60s"
    method = "GET"
    path = "/api/health"

[[restart]]
  policy = "always"
  processes = ["notification"]

[[restart]]
  policy = "on-failure"
  processes = ["app", "website", "ingestion"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
  processes = ["notification"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
  processes = ["website"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
  processes = ["ingestion"]

[[mounts]]
  source = "data"
  destination = "/data"
  processes = ["app"]
