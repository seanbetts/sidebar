<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
</head>
<body>
    <div class="share-state">
        <div class="grab-handle" aria-hidden="true"></div>
        <div id="state-icon" class="state-icon kind-pending" aria-hidden="true">
            <picture class="loading-wrap">
                <source srcset="images/loading-dark.gif" media="(prefers-color-scheme: dark)">
                <img id="loading-gif" class="loading-gif" src="images/loading-light.gif" alt="" />
            </picture>
            <span id="state-glyph" class="state-glyph"></span>
        </div>
        <div id="status" class="status" role="status" aria-live="polite">Saving website...</div>
    </div>
</body>
</html>
