repos:
  # Python - Ruff (linting + formatting)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--config=pyproject.toml, --fix]
        files: ^backend/(api|workers)/.*\.py$
      - id: ruff-format
        args: [--config=pyproject.toml]
        files: ^backend/(api|workers)/.*\.py$

  # Python - Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        files: ^backend/api/(?!alembic/).*\.py$
        args: [--config-file=backend/pyproject.toml, --no-incremental]
        additional_dependencies:
          - sqlalchemy[mypy]
          - pydantic
          - fastapi
          - types-requests
          - lxml-stubs

  # Python - Docstring coverage
  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        pass_filenames: false
        args: [--fail-under=80, --verbose, --ignore-init-method, --exclude=backend/api/alembic, backend/api]
        files: ^backend/api/

  # Python - Docstring style
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: [--convention=google]
        files: ^backend/api/(?!alembic/versions/).*\.py$

  # Frontend - Prettier formatting
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: node frontend/node_modules/.bin/prettier --config frontend/.prettierrc --plugin ./frontend/node_modules/prettier-plugin-svelte/plugin.js --write
        language: system
        files: ^frontend/.*\.(ts|js|svelte|json|md|yml|yaml)$

  # iOS - Plist validation
  - repo: local
    hooks:
      - id: plist-lint
        name: plist-lint
        entry: plutil -lint
        language: system
        files: \.plist$
        types: [file]

  # iOS - Xcode tests (manual only)
  - repo: local
    hooks:
      - id: swiftlint
        name: swiftlint
        entry: bash -lc 'cd ios/sideBar && swiftlint --strict'
        language: system
        files: ^ios/.*\.swift$
        pass_filenames: false
      - id: ios-doc-comments
        name: ios-doc-comments
        entry: python scripts/check_ios_doc_comments.py
        language: system
        files: ^ios/sideBar/sideBar/(ViewModels|Services|Stores)/.*\.swift$
        pass_filenames: false
      - id: ios-extension-config-resolution
        name: ios-extension-config-resolution
        entry: python scripts/check_ios_extension_config_resolution.py
        language: system
        files: ^(ios/sideBar/Config/SideBar\.xcconfig|ios/sideBar/sideBar\.xcodeproj/project\.pbxproj|scripts/check_ios_extension_config_resolution\.py)$
        pass_filenames: false
      - id: check-cert-pins
        name: check-cert-pins
        entry: bash ios/check-cert-pins.sh
        language: system
        files: ^ios/sideBar/sideBar/Resources/.*\.cer$
        pass_filenames: false
        stages: [manual]

  # Frontend - ESLint (all files)
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.17.0
    hooks:
      - id: eslint
        files: ^frontend/src/.*\.(ts|js|svelte)$
        args: [--fix, --max-warnings=0]
        additional_dependencies:
          - eslint@9.39.2
          - eslint-plugin-jsdoc@61.5.0
          - eslint-plugin-svelte@2.46.1
          - svelte-eslint-parser@1.4.1
          - '@typescript-eslint/eslint-plugin@8.50.1'
          - '@typescript-eslint/parser@8.50.1'

  # Docker - Dockerfile linting
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.12.1-beta
    hooks:
      - id: hadolint
        files: ^backend/docker/Dockerfile.*$
        args: [--config, backend/docker/.hadolint.yaml]

  # Shell - Script validation
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: \.(sh|bash)$
        args: [--severity=warning]  # Skip info-level (SC1091 for .env sourcing)

  # General - File hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1000]
        exclude: ^ios/sideBar/Vendor/Sentry/
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: ^ios/sideBar/Vendor/Sentry/
      - id: trailing-whitespace
        exclude: ^ios/sideBar/Vendor/Sentry/
      - id: no-commit-to-branch
        args: [--branch, main]

  # Custom - File size limits
  - repo: local
    hooks:
      - id: sync-assets
        name: sync-assets
        entry: scripts/sync-assets.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: check-file-size-limits
        name: check-file-size-limits
        entry: python scripts/check_file_sizes.py
        language: system
        files: ^(backend/api/services|backend/api/routers|frontend/src/lib/components|frontend/src/lib/stores)/.*\.(py|ts|svelte)$
      - id: check-notes-runtime-boundary
        name: check-notes-runtime-boundary
        entry: python scripts/check_notes_runtime_boundary.py
        language: system
        files: ^ios/sideBar/sideBar/.*\.swift$
        pass_filenames: false
