name: Skills Validation

on:
  push:
    paths:
      - "backend/skills/**"
      - "docs/SKILL_AUTHORING.md"
      - ".github/workflows/skills-validation.yml"
  pull_request:
    paths:
      - "backend/skills/**"
      - "docs/SKILL_AUTHORING.md"
      - ".github/workflows/skills-validation.yml"

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install validator dependency
        run: python -m pip install --upgrade pip pyyaml

      - name: Validate all skills
        run: |
          set -euo pipefail

          validator="backend/scripts/skill_quick_validate.py"
          skills_root="backend/skills"

          mapfile -t skill_dirs < <(find "${skills_root}" -mindepth 1 -maxdepth 1 -type d | sort)

          if [[ ${#skill_dirs[@]} -eq 0 ]]; then
            echo "No skill directories found under ${skills_root}"
            exit 1
          fi

          for skill_dir in "${skill_dirs[@]}"; do
            if [[ ! -f "${skill_dir}/SKILL.md" ]]; then
              continue
            fi
            echo "Validating ${skill_dir}"
            python "${validator}" "${skill_dir}"
          done
