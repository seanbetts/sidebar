name: iOS CI (main)

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci-main.yml"

concurrency:
  group: ios-ci-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios_test_full:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Resolve packages
        run: |
          xcodebuild -project ios/sideBar/sideBar.xcodeproj \
            -scheme sideBar \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -resolvePackageDependencies \
            -onlyUsePackageVersionsFromResolvedFile
      - name: Run full test suite
        id: full_tests
        continue-on-error: true
        run: |
          xcodebuild test \
            -project ios/sideBar/sideBar.xcodeproj \
            -scheme sideBar \
            -testPlan AppleStateful \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-repetition-relaunch-enabled YES \
            -resultBundlePath "${{ runner.temp }}/ios-test-results/main.xcresult"
      - name: Check full test suite results
        if: steps.full_tests.outcome == 'failure'
        run: |
          echo "::warning::Full test suite exited with non-zero status. Checking xcresult for actual failures..."
          SUMMARY=$(xcrun xcresulttool get test-results summary \
            --path "${{ runner.temp }}/ios-test-results/main.xcresult" 2>/dev/null || true)
          echo "$SUMMARY"
          if echo "$SUMMARY" | grep -q '"failedTests" : 0'; then
            echo "All tests passed despite non-zero exit (likely test host crash with successful retry)."
          else
            echo "::error::Test failures detected in xcresult."
            exit 1
          fi
      - name: Run UI smoke tests
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SIDEBAR_UI_TEST_EMAIL: ${{ secrets.SIDEBAR_UI_TEST_EMAIL }}
          SIDEBAR_UI_TEST_PASSWORD: ${{ secrets.SIDEBAR_UI_TEST_PASSWORD }}
        run: |
          xcodebuild test \
            -project ios/sideBar/sideBar.xcodeproj \
            -scheme sideBarUI \
            -testPlan AppleUI \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -parallel-testing-enabled NO \
            -resultBundlePath "${{ runner.temp }}/ios-test-results/main-ui.xcresult"
      - name: Run extension tests
        run: |
          xcodebuild test \
            -project ios/sideBar/sideBar.xcodeproj \
            -scheme sideBarExtensions \
            -testPlan AppleExtensions \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -parallel-testing-enabled NO \
            -resultBundlePath "${{ runner.temp }}/ios-test-results/main-extensions.xcresult"
      - name: Cleanup
        if: always()
        run: rm -rf "${{ runner.temp }}/ios-test-results"
