name: iOS CI (main)

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci-main.yml"

concurrency:
  group: ios-ci-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios_test_full:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    env:
      IOS_SIMULATOR_DEVICE: iPhone 17 Pro
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Resolve packages
        run: |
          xcodebuild -project ios/sideBar/sideBar.xcodeproj \
            -scheme sideBarLogicHost \
            -destination 'platform=macOS' \
            -resolvePackageDependencies \
            -onlyUsePackageVersionsFromResolvedFile
      - name: Run logic tests (macOS, no simulator)
        run: |
          xcodebuild test \
            -project ios/sideBar/sideBar.xcodeproj \
            -scheme sideBarLogicHost \
            -testPlan AppleFast \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=
      - name: Resolve UI packages
        run: |
          xcodebuild -project ios/sideBar/sideBar.xcodeproj \
            -scheme sideBarUI \
            -destination "platform=iOS Simulator,name=$IOS_SIMULATOR_DEVICE" \
            -resolvePackageDependencies \
            -onlyUsePackageVersionsFromResolvedFile
      - name: Boot simulator for UI smoke tests
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl boot "$IOS_SIMULATOR_DEVICE" || true
          xcrun simctl bootstatus "$IOS_SIMULATOR_DEVICE" -b
      - name: Run UI smoke tests
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SIDEBAR_UI_TEST_EMAIL: ${{ secrets.SIDEBAR_UI_TEST_EMAIL }}
          SIDEBAR_UI_TEST_PASSWORD: ${{ secrets.SIDEBAR_UI_TEST_PASSWORD }}
          SIDEBAR_RUN_LIVE_UI_TESTS: "1"
        run: |
          xcodebuild test \
            -project ios/sideBar/sideBar.xcodeproj \
            -scheme sideBarUI \
            -testPlan AppleUI \
            -destination "platform=iOS Simulator,name=$IOS_SIMULATOR_DEVICE" \
            -parallel-testing-enabled NO \
            -resultBundlePath "${{ runner.temp }}/ios-test-results/main-ui.xcresult"
      - name: Reset simulator for extension tests
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl boot "$IOS_SIMULATOR_DEVICE" || true
          xcrun simctl bootstatus "$IOS_SIMULATOR_DEVICE" -b
      - name: Run extension tests
        run: |
          xcodebuild test \
            -project ios/sideBar/sideBar.xcodeproj \
            -scheme sideBarExtensions \
            -testPlan AppleExtensions \
            -destination "platform=iOS Simulator,name=$IOS_SIMULATOR_DEVICE" \
            -parallel-testing-enabled NO \
            -resultBundlePath "${{ runner.temp }}/ios-test-results/main-extensions.xcresult"
      - name: Cleanup
        if: always()
        run: rm -rf "${{ runner.temp }}/ios-test-results"
