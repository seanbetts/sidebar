name: Deploy API to Fly

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/fly-deploy.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/fly-deploy.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: fly-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sidebar
          POSTGRES_PASSWORD: sidebar_dev
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sidebar -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TESTING: "1"
      AUTH_DEV_MODE: "true"
      TEST_USER_ID: "test-user-id"
      DATABASE_URL: "postgresql://sidebar:sidebar_dev@localhost:5433/sidebar_test"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.0"
          enable-cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --dev --frozen

      - name: Create test database
        working-directory: backend
        run: |
          uv run python - <<'PY'
          import psycopg2
          conn = psycopg2.connect("postgresql://sidebar:sidebar_dev@localhost:5433/postgres")
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute("SELECT 1 FROM pg_database WHERE datname = 'sidebar_test'")
              if cur.fetchone() is None:
                  cur.execute("CREATE DATABASE sidebar_test OWNER sidebar")
          conn.close()
          PY

      - name: Add Supabase auth.uid shim for vanilla Postgres
        working-directory: backend
        run: |
          uv run python - <<'PY'
          import psycopg2

          conn = psycopg2.connect("postgresql://sidebar:sidebar_dev@localhost:5433/sidebar_test")
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute("CREATE SCHEMA IF NOT EXISTS auth")
              cur.execute(
                  """
                  CREATE OR REPLACE FUNCTION auth.uid()
                  RETURNS uuid
                  LANGUAGE sql
                  STABLE
                  AS $$
                    SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid
                  $$;
                  """
              )
          conn.close()
          PY

      - name: Apply migrations
        working-directory: backend
        run: DATABASE_URL_DIRECT="${DATABASE_URL}" uv run alembic -c api/alembic.ini upgrade head

      - name: Run ingestion regression tests
        working-directory: backend
        run: |
          uv run pytest \
            tests/skills/test_youtube_download.py \
            tests/api/test_skill_file_ops_ingestion.py

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set image reference
        id: image
        run: echo "ref=registry.fly.io/sidebar-api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile.skills-api
          push: false
          load: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha,scope=fly-deploy-api
          cache-to: type=gha,mode=max,scope=fly-deploy-api

      - name: Install Flyctl
        env:
          FLYCTL_VERSION: "0.3.221"
        run: |
          curl -fsSL https://fly.io/install.sh | sh -s "${FLYCTL_VERSION}"
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Show Flyctl version
        run: flyctl version

      - name: Authenticate Docker to Fly registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if flyctl auth docker; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to authenticate Docker to Fly registry after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Push image to Fly registry
        run: docker push "${{ steps.image.outputs.ref }}"

      - name: Deploy
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl -c fly.toml deploy --image "${{ steps.image.outputs.ref }}" --deploy-retries 3

      - name: Collect Fly diagnostics on deploy failure
        if: failure()
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl -c fly.toml status --json || true
          flyctl -c fly.toml machine list --json || true
          flyctl -c fly.toml logs --json --no-tail --region lhr || true

      - name: Ensure ingestion worker machine is running
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl -c fly.toml scale count 1 --yes --process-group ingestion --region lhr

      - name: Ensure website worker machine is running
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl -c fly.toml scale count 1 --yes --process-group website --region lhr

      - name: Verify ingestion worker machine state
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import subprocess

          result = subprocess.run(
              ["flyctl", "-c", "fly.toml", "machine", "list", "--json"],
              check=True,
              capture_output=True,
              text=True,
          )
          machines = json.loads(result.stdout)
          def machine_process_group(machine: dict[str, object]) -> str | None:
              config = machine.get("config") or {}
              metadata = config.get("metadata") or {}
              env = config.get("env") or {}
              return (
                  machine.get("process_group")
                  or metadata.get("fly_process_group")
                  or env.get("FLY_PROCESS_GROUP")
              )

          has_started_ingestion = any(
              machine_process_group(machine) == "ingestion"
              and machine.get("state") == "started"
              for machine in machines
          )
          if not has_started_ingestion:
              print(json.dumps(machines, indent=2))
              raise SystemExit("No started ingestion machine found after deploy")
          PY

      - name: Verify website worker machine state
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import subprocess

          result = subprocess.run(
              ["flyctl", "-c", "fly.toml", "machine", "list", "--json"],
              check=True,
              capture_output=True,
              text=True,
          )
          machines = json.loads(result.stdout)
          def machine_process_group(machine: dict[str, object]) -> str | None:
              config = machine.get("config") or {}
              metadata = config.get("metadata") or {}
              env = config.get("env") or {}
              return (
                  machine.get("process_group")
                  or metadata.get("fly_process_group")
                  or env.get("FLY_PROCESS_GROUP")
              )

          has_started_website = any(
              machine_process_group(machine) == "website"
              and machine.get("state") == "started"
              for machine in machines
          )
          if not has_started_website:
              print(json.dumps(machines, indent=2))
              raise SystemExit("No started website machine found after deploy")
          PY
