name: Deploy API to Fly

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/fly-deploy.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/fly-deploy.yml"
  workflow_dispatch:

concurrency:
  group: fly-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sidebar
          POSTGRES_PASSWORD: sidebar_dev
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sidebar -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TESTING: "1"
      AUTH_DEV_MODE: "true"
      TEST_USER_ID: "test-user-id"
      DATABASE_URL: "postgresql://sidebar:sidebar_dev@localhost:5433/sidebar_test"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --dev --frozen

      - name: Create test database
        working-directory: backend
        run: |
          uv run python - <<'PY'
          import psycopg2
          conn = psycopg2.connect("postgresql://sidebar:sidebar_dev@localhost:5433/postgres")
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute("SELECT 1 FROM pg_database WHERE datname = 'sidebar_test'")
              if cur.fetchone() is None:
                  cur.execute("CREATE DATABASE sidebar_test OWNER sidebar")
          conn.close()
          PY

      - name: Add Supabase auth.uid shim for vanilla Postgres
        working-directory: backend
        run: |
          uv run python - <<'PY'
          import psycopg2

          conn = psycopg2.connect("postgresql://sidebar:sidebar_dev@localhost:5433/sidebar_test")
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute("CREATE SCHEMA IF NOT EXISTS auth")
              cur.execute(
                  """
                  CREATE OR REPLACE FUNCTION auth.uid()
                  RETURNS uuid
                  LANGUAGE sql
                  STABLE
                  AS $$
                    SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid
                  $$;
                  """
              )
          conn.close()
          PY

      - name: Apply migrations
        working-directory: backend
        run: DATABASE_URL_DIRECT="${DATABASE_URL}" uv run alembic -c api/alembic.ini upgrade head

      - name: Run ingestion regression tests
        working-directory: backend
        run: |
          uv run pytest \
            tests/skills/test_youtube_download.py \
            tests/api/test_skill_file_ops_ingestion.py

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl -c fly.toml deploy
