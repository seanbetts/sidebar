name: Deploy API to Fly

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/fly-deploy.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/fly-deploy.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: fly-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sidebar
          POSTGRES_PASSWORD: sidebar_dev
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sidebar -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TESTING: "1"
      AUTH_DEV_MODE: "true"
      TEST_USER_ID: "test-user-id"
      DATABASE_URL: "postgresql://sidebar:sidebar_dev@localhost:5433/sidebar_test"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.0"
          enable-cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --dev --frozen

      - name: Create test database
        working-directory: backend
        run: |
          uv run python - <<'PY'
          import psycopg2
          conn = psycopg2.connect("postgresql://sidebar:sidebar_dev@localhost:5433/postgres")
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute("SELECT 1 FROM pg_database WHERE datname = 'sidebar_test'")
              if cur.fetchone() is None:
                  cur.execute("CREATE DATABASE sidebar_test OWNER sidebar")
          conn.close()
          PY

      - name: Add Supabase auth.uid shim for vanilla Postgres
        working-directory: backend
        run: |
          uv run python - <<'PY'
          import psycopg2

          conn = psycopg2.connect("postgresql://sidebar:sidebar_dev@localhost:5433/sidebar_test")
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute("CREATE SCHEMA IF NOT EXISTS auth")
              cur.execute(
                  """
                  CREATE OR REPLACE FUNCTION auth.uid()
                  RETURNS uuid
                  LANGUAGE sql
                  STABLE
                  AS $$
                    SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid
                  $$;
                  """
              )
          conn.close()
          PY

      - name: Apply migrations
        working-directory: backend
        run: DATABASE_URL_DIRECT="${DATABASE_URL}" uv run alembic -c api/alembic.ini upgrade head

      - name: Run deployment regression tests
        working-directory: backend
        run: |
          uv run pytest \
            tests/api/test_alembic_migration_lineage.py \
            tests/scripts/test_run_production_migrations.py \
            tests/scripts/test_fly_toml.py \
            tests/skills/test_youtube_download.py \
            tests/api/test_skill_file_ops_ingestion.py

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set image reference
        id: image
        run: echo "ref=registry.fly.io/sidebar-api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile.skills-api
          push: false
          load: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha,scope=fly-deploy-api
          cache-to: type=gha,mode=max,scope=fly-deploy-api

      - name: Install Flyctl
        env:
          FLYCTL_VERSION: "0.3.221"
        run: |
          curl -fsSL https://fly.io/install.sh | sh -s "${FLYCTL_VERSION}"
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Show Flyctl version
        run: flyctl version

      - name: Authenticate Docker to Fly registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if flyctl auth docker; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to authenticate Docker to Fly registry after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Push image to Fly registry
        run: docker push "${{ steps.image.outputs.ref }}"

      - name: Deploy
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl -c fly.toml deploy --image "${{ steps.image.outputs.ref }}" --deploy-retries 3

      - name: Reconcile Fly Machine topology
        id: topology
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from collections.abc import Mapping

          EXPECTED_GROUPS = ("app", "notification", "website", "ingestion")
          HEALTHY_STATES = {"started", "starting", "stopping", "stopped", "suspended"}
          MACHINE_ID = re.compile(r"^[0-9a-f]{14}$")
          FLY_REGION = re.compile(r"^[a-z]{3}$")

          def mapping(value: object) -> Mapping[str, object]:
              return value if isinstance(value, Mapping) else {}

          def machine_process_group(machine: Mapping[str, object]) -> str | None:
              config = mapping(machine.get("config"))
              metadata = mapping(config.get("metadata"))
              env = mapping(config.get("env"))
              process_group = (
                  machine.get("process_group")
                  or metadata.get("fly_process_group")
                  or env.get("FLY_PROCESS_GROUP")
              )
              return process_group if isinstance(process_group, str) else None

          def inspect_topology(
              payload: object,
          ) -> tuple[dict[str, list[dict[str, str]]], list[str], int]:
              if not isinstance(payload, list):
                  return {}, ["malformed Machine list response"], 1
              grouped: dict[str, list[dict[str, str]]] = {
                  process_group: [] for process_group in EXPECTED_GROUPS
              }
              invalid_count = 0
              for machine in payload:
                  if not isinstance(machine, Mapping):
                      invalid_count += 1
                      continue
                  process_group = machine_process_group(machine)
                  machine_id = machine.get("id")
                  state = machine.get("state")
                  region = machine.get("region")
                  if (
                      process_group not in EXPECTED_GROUPS
                      or not isinstance(machine_id, str)
                      or not MACHINE_ID.fullmatch(machine_id)
                      or not isinstance(state, str)
                      or state not in HEALTHY_STATES
                      or not isinstance(region, str)
                      or not FLY_REGION.fullmatch(region)
                  ):
                      invalid_count += 1
                      continue
                  grouped[process_group].append({"id": machine_id, "state": state})
              errors = [
                  f"duplicate {process_group} Machines"
                  for process_group in EXPECTED_GROUPS
                  if len(grouped[process_group]) > 1
              ]
              if invalid_count:
                  errors.insert(0, "unknown or malformed Machines")
              return grouped, errors, invalid_count

          def safe_summary(
              grouped: dict[str, list[dict[str, str]]], invalid_count: int
          ) -> dict[str, object]:
              return {
                  "process_groups": {
                      process_group: {
                          "count": len(grouped.get(process_group, [])),
                          "states": [
                              machine["state"]
                              for machine in grouped.get(process_group, [])
                          ],
                      }
                      for process_group in EXPECTED_GROUPS
                  },
                  "unrecognized_count": invalid_count,
              }

          result = subprocess.run(
              ["flyctl", "-c", "fly.toml", "machine", "list", "--json"],
              check=True,
              capture_output=True,
              text=True,
          )
          try:
              payload = json.loads(result.stdout)
          except (TypeError, json.JSONDecodeError):
              payload = None

          grouped, errors, invalid_count = inspect_topology(payload)
          if errors:
              print("Fly Machine topology is invalid.", file=sys.stderr)
              for error in errors:
                  print(error, file=sys.stderr)
              print(json.dumps(safe_summary(grouped, invalid_count), indent=2), file=sys.stderr)
              raise SystemExit(1)

          notification_rows = grouped["notification"]
          notification_id = notification_rows[0]["id"] if notification_rows else ""
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"notification_machine_id={notification_id}\n")

          for process_group in EXPECTED_GROUPS:
              if grouped[process_group]:
                  print(f"Preserving existing {process_group} Machine.")
                  continue
              print(f"Creating missing {process_group} Machine.")
              subprocess.run(
                  [
                      "flyctl",
                      "-c",
                      "fly.toml",
                      "scale",
                      "count",
                      "1",
                      "--yes",
                      "--process-group",
                      process_group,
                      "--region",
                      "lhr",
                  ],
                  check=True,
              )
          PY

      - name: Start and verify notification control Machine
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          RECONCILED_NOTIFICATION_MACHINE_ID: ${{ steps.topology.outputs.notification_machine_id }}
          FLY_MACHINE_POLL_SECONDS: "5"
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          from collections.abc import Mapping

          EXPECTED_GROUPS = ("app", "notification", "website", "ingestion")
          HEALTHY_STATES = {"started", "starting", "stopping", "stopped", "suspended"}
          MACHINE_ID = re.compile(r"^[0-9a-f]{14}$")
          FLY_REGION = re.compile(r"^[a-z]{3}$")
          RECOVERABLE_STATES = {"stopped", "suspended"}
          TRANSITION_STATES = {"starting", "stopping"}

          def mapping(value: object) -> Mapping[str, object]:
              return value if isinstance(value, Mapping) else {}

          def machine_process_group(machine: Mapping[str, object]) -> str | None:
              config = mapping(machine.get("config"))
              metadata = mapping(config.get("metadata"))
              env = mapping(config.get("env"))
              process_group = (
                  machine.get("process_group")
                  or metadata.get("fly_process_group")
                  or env.get("FLY_PROCESS_GROUP")
              )
              return process_group if isinstance(process_group, str) else None

          def inspect_topology(
              payload: object,
          ) -> tuple[dict[str, list[dict[str, str]]], list[str]]:
              if not isinstance(payload, list):
                  return {}, ["malformed Machine list response"]
              grouped: dict[str, list[dict[str, str]]] = {
                  process_group: [] for process_group in EXPECTED_GROUPS
              }
              invalid_count = 0
              for machine in payload:
                  if not isinstance(machine, Mapping):
                      invalid_count += 1
                      continue
                  process_group = machine_process_group(machine)
                  machine_id = machine.get("id")
                  state = machine.get("state")
                  region = machine.get("region")
                  if (
                      process_group not in EXPECTED_GROUPS
                      or not isinstance(machine_id, str)
                      or not MACHINE_ID.fullmatch(machine_id)
                      or not isinstance(state, str)
                      or state not in HEALTHY_STATES
                      or not isinstance(region, str)
                      or not FLY_REGION.fullmatch(region)
                  ):
                      invalid_count += 1
                      continue
                  grouped[process_group].append({"id": machine_id, "state": state})
              errors = [
                  f"duplicate {process_group} Machines"
                  for process_group in EXPECTED_GROUPS
                  if len(grouped[process_group]) > 1
              ]
              if invalid_count:
                  errors.insert(0, "unknown or malformed Machines")
              return grouped, errors

          try:
              poll_seconds = float(os.environ["FLY_MACHINE_POLL_SECONDS"])
          except (KeyError, ValueError):
              raise SystemExit("Fly Machine poll interval is invalid.")
          if poll_seconds < 0:
              raise SystemExit("Fly Machine poll interval is invalid.")

          pinned_notification_id = os.environ.get(
              "RECONCILED_NOTIFICATION_MACHINE_ID", ""
          ).strip()
          if pinned_notification_id and not MACHINE_ID.fullmatch(pinned_notification_id):
              raise SystemExit("Reconciled notification Machine identity is invalid.")

          observed_ids: dict[str, str] = {}
          start_requested = False
          deadline = time.monotonic() + 90
          while True:
              result = subprocess.run(
                  ["flyctl", "-c", "fly.toml", "machine", "list", "--json"],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              try:
                  payload = json.loads(result.stdout)
              except (TypeError, json.JSONDecodeError):
                  payload = None

              grouped, errors = inspect_topology(payload)
              if errors:
                  print("Notification recovery topology is invalid.", file=sys.stderr)
                  for error in errors:
                      print(error, file=sys.stderr)
                  raise SystemExit(1)

              for process_group in EXPECTED_GROUPS:
                  rows = grouped[process_group]
                  if len(rows) != 1:
                      continue
                  machine_id = rows[0]["id"]
                  prior_id = observed_ids.setdefault(process_group, machine_id)
                  if prior_id != machine_id:
                      raise SystemExit(
                          "Machine identity changed during notification recovery."
                      )

              notification_rows = grouped["notification"]
              if notification_rows:
                  current_notification_id = notification_rows[0]["id"]
                  if (
                      pinned_notification_id
                      and current_notification_id != pinned_notification_id
                  ):
                      raise SystemExit(
                          "Machine identity changed during notification recovery."
                      )

              missing_groups = [
                  process_group
                  for process_group in EXPECTED_GROUPS
                  if not grouped[process_group]
              ]
              remaining = deadline - time.monotonic()
              if missing_groups:
                  if remaining <= 0:
                      raise SystemExit(
                          "Notification recovery topology did not converge within 90 seconds."
                      )
                  time.sleep(min(poll_seconds, remaining))
                  continue

              if not pinned_notification_id:
                  pinned_notification_id = notification_rows[0]["id"]
              state = notification_rows[0]["state"]
              if state == "started":
                  print("Notification control Machine is started.")
                  raise SystemExit(0)
              if state in RECOVERABLE_STATES and not start_requested:
                  subprocess.run(
                      [
                          "flyctl",
                          "-c",
                          "fly.toml",
                          "machine",
                          "start",
                          pinned_notification_id,
                      ],
                      check=True,
                  )
                  start_requested = True
                  continue
              if state not in RECOVERABLE_STATES | TRANSITION_STATES:
                  raise SystemExit("Notification Machine has an unsupported state.")
              if remaining <= 0:
                  raise SystemExit(
                      "Notification Machine did not become started within 90 seconds."
                  )
              time.sleep(min(poll_seconds, remaining))
          PY

      - name: Verify demand-aware Fly Machine lifecycle
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DEMAND_WORKER_SETTLE_SECONDS: "90"
          FLY_MACHINE_POLL_SECONDS: "5"
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          from collections.abc import Mapping

          EXPECTED_GROUPS = ("app", "notification", "website", "ingestion")
          HEALTHY_STATES = {"started", "starting", "stopping", "stopped", "suspended"}
          IDLE_STATES = {"stopped", "suspended"}
          MACHINE_ID = re.compile(r"^[0-9a-f]{14}$")
          FLY_REGION = re.compile(r"^[a-z]{3}$")

          def mapping(value: object) -> Mapping[str, object]:
              return value if isinstance(value, Mapping) else {}

          def machine_process_group(machine: Mapping[str, object]) -> str | None:
              config = mapping(machine.get("config"))
              metadata = mapping(config.get("metadata"))
              env = mapping(config.get("env"))
              process_group = (
                  machine.get("process_group")
                  or metadata.get("fly_process_group")
                  or env.get("FLY_PROCESS_GROUP")
              )
              return process_group if isinstance(process_group, str) else None

          def inspect_topology(
              payload: object,
          ) -> tuple[dict[str, list[dict[str, str]]], list[str]]:
              if not isinstance(payload, list):
                  return {}, ["malformed Machine list response"]
              grouped: dict[str, list[dict[str, str]]] = {
                  process_group: [] for process_group in EXPECTED_GROUPS
              }
              invalid_count = 0
              for machine in payload:
                  if not isinstance(machine, Mapping):
                      invalid_count += 1
                      continue
                  process_group = machine_process_group(machine)
                  machine_id = machine.get("id")
                  state = machine.get("state")
                  region = machine.get("region")
                  if (
                      process_group not in EXPECTED_GROUPS
                      or not isinstance(machine_id, str)
                      or not MACHINE_ID.fullmatch(machine_id)
                      or not isinstance(state, str)
                      or state not in HEALTHY_STATES
                      or not isinstance(region, str)
                      or not FLY_REGION.fullmatch(region)
                  ):
                      invalid_count += 1
                      continue
                  grouped[process_group].append({"id": machine_id, "state": state})
              errors = [
                  f"duplicate {process_group} Machines"
                  for process_group in EXPECTED_GROUPS
                  if len(grouped[process_group]) > 1
              ]
              if invalid_count:
                  errors.insert(0, "unknown or malformed Machines")
              return grouped, errors

          try:
              settle_seconds = int(os.environ["DEMAND_WORKER_SETTLE_SECONDS"])
          except (KeyError, ValueError):
              raise SystemExit("Demand worker settle window is invalid.")
          if settle_seconds < 0:
              raise SystemExit("Demand worker settle window is invalid.")
          try:
              poll_seconds = float(os.environ["FLY_MACHINE_POLL_SECONDS"])
          except (KeyError, ValueError):
              raise SystemExit("Fly Machine poll interval is invalid.")
          if poll_seconds < 0:
              raise SystemExit("Fly Machine poll interval is invalid.")

          deadline = time.monotonic() + settle_seconds
          observed_ids: dict[str, str] = {}
          while True:
              result = subprocess.run(
                  ["flyctl", "-c", "fly.toml", "machine", "list", "--json"],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              try:
                  payload = json.loads(result.stdout)
              except (TypeError, json.JSONDecodeError):
                  payload = None

              grouped, errors = inspect_topology(payload)
              if errors:
                  print("Fly lifecycle topology is invalid.", file=sys.stderr)
                  for error in errors:
                      print(error, file=sys.stderr)
                  raise SystemExit(1)

              for process_group in EXPECTED_GROUPS:
                  rows = grouped[process_group]
                  if len(rows) != 1:
                      continue
                  machine_id = rows[0]["id"]
                  prior_id = observed_ids.setdefault(process_group, machine_id)
                  if prior_id != machine_id:
                      raise SystemExit(
                          "Machine identity changed during lifecycle verification."
                      )

              notification_rows = grouped["notification"]
              if notification_rows and notification_rows[0]["state"] != "started":
                  raise SystemExit("Notification control Machine is not started.")

              missing_groups = [
                  process_group
                  for process_group in EXPECTED_GROUPS
                  if not grouped[process_group]
              ]
              remaining = deadline - time.monotonic()
              if missing_groups:
                  if remaining <= 0:
                      raise SystemExit(
                          "Fly Machine topology did not converge before the lifecycle deadline."
                      )
                  time.sleep(min(poll_seconds, remaining))
                  continue

              states = {
                  process_group: grouped[process_group][0]["state"]
                  for process_group in EXPECTED_GROUPS
              }
              active_workers = [
                  process_group
                  for process_group in ("website", "ingestion")
                  if states[process_group] not in IDLE_STATES
              ]
              if not active_workers:
                  print("Demand worker Machines are stopped or suspended.")
                  raise SystemExit(0)

              if remaining <= 0:
                  summary = ", ".join(
                      f"{process_group}={states[process_group]}"
                      for process_group in active_workers
                  )
                  print(
                      "Demand workers remained active through the 90-second settle "
                      f"window; queued work may still be active: {summary}"
                  )
                  raise SystemExit(0)
              time.sleep(min(poll_seconds, remaining))
          PY

      - name: Collect scoped Fly diagnostics on failure
        if: failure()
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import subprocess
          from collections.abc import Mapping

          EXPECTED_GROUPS = ("app", "notification", "website", "ingestion")
          HEALTHY_STATES = {"started", "starting", "stopping", "stopped", "suspended"}

          def mapping(value: object) -> Mapping[str, object]:
              return value if isinstance(value, Mapping) else {}

          def machine_process_group(machine: Mapping[str, object]) -> str | None:
              config = mapping(machine.get("config"))
              metadata = mapping(config.get("metadata"))
              env = mapping(config.get("env"))
              process_group = (
                  machine.get("process_group")
                  or metadata.get("fly_process_group")
                  or env.get("FLY_PROCESS_GROUP")
              )
              return process_group if isinstance(process_group, str) else None

          try:
              result = subprocess.run(
                  ["flyctl", "-c", "fly.toml", "machine", "list", "--json"],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              payload = json.loads(result.stdout)
          except Exception:
              print("Scoped Fly Machine diagnostics are unavailable.")
              raise SystemExit(0)

          process_groups: dict[str, dict[str, object]] = {
              process_group: {"count": 0, "states": []}
              for process_group in EXPECTED_GROUPS
          }
          unrecognized_count = 0
          if isinstance(payload, list):
              for machine in payload:
                  if not isinstance(machine, Mapping):
                      unrecognized_count += 1
                      continue
                  process_group = machine_process_group(machine)
                  if process_group not in EXPECTED_GROUPS:
                      unrecognized_count += 1
                      continue
                  state = machine.get("state")
                  process_groups[process_group]["count"] += 1
                  if isinstance(state, str) and state in HEALTHY_STATES:
                      process_groups[process_group]["states"].append(state)
          print(
              json.dumps(
                  {
                      "process_groups": process_groups,
                      "unrecognized_count": unrecognized_count,
                  },
                  indent=2,
              )
          )
          PY
