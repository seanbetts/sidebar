name: iOS CI

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Run specific lane"
        type: choice
        required: false
        default: all
        options:
          - all
          - ipad
          - iphone
          - mac
  push:
    branches: [dev]
    paths:
      - "ios/**"
      - "scripts/check_ios_architecture_boundaries.py"
      - "scripts/ios_architecture_boundaries_baseline.json"
      - "scripts/check_ios_doc_comments.py"
      - "scripts/validate_ios_test_lane.py"
      - "scripts/check_ios_quality_gates.py"
      - "scripts/ios_quality_gates.json"
      - "scripts/test-ios.sh"
      - ".github/workflows/ios-ci.yml"

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios_quality:
    runs-on: [self-hosted, mac]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: SwiftLint
        run: swiftlint --config .swiftlint.yml
        working-directory: ios/sideBar
      - name: Doc comment coverage
        run: python3 scripts/check_ios_doc_comments.py
      - name: Architecture boundaries
        run: python3 scripts/check_ios_architecture_boundaries.py

  ios_test_matrix:
    runs-on:
      - self-hosted
      - ${{ matrix.runner_label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ipad
            label: "iPad Pro 13-inch (M5) iPadOS 26"
            scheme: sideBar
            destination: "platform=iOS Simulator,name=iPad Pro 13-inch (M5)"
            runner_label: ios
            only_testing: sideBarUITests
            skip_testing: sideBarUITests/SideBarUITestsLaunchTests
            retry_tests_on_failure: "NO"
            parallel_testing_enabled: "NO"
            max_parallel_test_workers: "1"
            destination_timeout: "180"
            enable_coverage: "NO"
          - id: iphone
            label: "iPhone 17 Pro iOS 26"
            scheme: sideBar
            destination: "platform=iOS Simulator,name=iPhone 17 Pro"
            runner_label: ios
            skip_testing: sideBarUITests
            retry_tests_on_failure: "YES"
            destination_timeout: "180"
            enable_coverage: "YES"
          - id: mac
            label: "macOS 26"
            scheme: sideBarMacTests
            destination: "platform=macOS"
            runner_label: mac
            only_testing: sideBarTests
            skip_testing: sideBarUITests,ShareExtensionTests
            destination_timeout: "180"
            enable_coverage: "NO"
    steps:
      - name: Checkout
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.lane == 'all' || github.event.inputs.lane == matrix.id }}
        uses: actions/checkout@v4
      - name: Validate lane configuration (${{ matrix.label }})
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.lane == 'all' || github.event.inputs.lane == matrix.id }}
        run: |
          python3 scripts/validate_ios_test_lane.py \
            --project ios/sideBar/sideBar.xcodeproj \
            --scheme "${{ matrix.scheme }}" \
            --destination "${{ matrix.destination }}" \
            --only-testing "${{ matrix.only_testing }}" \
            --skip-testing "${{ matrix.skip_testing }}" \
            --allowed-macos-targets "sideBarTests"
      - name: Run tests (${{ matrix.label }})
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.lane == 'all' || github.event.inputs.lane == matrix.id }}
        env:
          IOS_SCHEME: ${{ matrix.scheme }}
          IOS_DESTINATION: ${{ matrix.destination }}
          IOS_DESTINATION_TIMEOUT: ${{ matrix.destination_timeout }}
          IOS_RESULT_BUNDLE_PATH: ${{ github.workspace }}/ios-test-results/${{ matrix.id }}.xcresult
          IOS_DERIVED_DATA_PATH: ${{ runner.temp }}/sidebar-deriveddata-${{ matrix.id }}
          IOS_CLEAN_DERIVED_DATA: "YES"
          IOS_ONLY_TESTING: ${{ matrix.only_testing }}
          IOS_SKIP_TESTING: ${{ matrix.skip_testing }}
          IOS_RETRY_TESTS_ON_FAILURE: ${{ matrix.retry_tests_on_failure }}
          IOS_ENABLE_CODE_COVERAGE: ${{ matrix.enable_coverage }}
          IOS_PARALLEL_TESTING_ENABLED: ${{ matrix.parallel_testing_enabled }}
          IOS_MAXIMUM_PARALLEL_TESTING_WORKERS: ${{ matrix.max_parallel_test_workers }}
        run: scripts/test-ios.sh
      - name: Upload xcresult bundle (${{ matrix.id }})
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || github.event.inputs.lane == 'all' || github.event.inputs.lane == matrix.id) }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult-${{ matrix.id }}
          path: ios-test-results/${{ matrix.id }}.xcresult
          if-no-files-found: ignore

  ios_hard_gates:
    needs: [ios_quality, ios_test_matrix]
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.lane == 'all' || github.event.inputs.lane == 'iphone' }}
    runs-on: [self-hosted, mac]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download iPhone xcresult
        uses: actions/download-artifact@v4
        with:
          name: ios-xcresult-iphone
          path: ios-test-results
      - name: Enforce hard quality gates
        run: |
          python3 scripts/check_ios_quality_gates.py \
            --xcresult ios-test-results/iphone.xcresult \
            --config scripts/ios_quality_gates.json
