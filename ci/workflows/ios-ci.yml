name: iOS CI

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Run specific lane"
        type: choice
        required: false
        default: all
        options:
          - all
          - ipad
          - iphone
          - mac
  pull_request:
    paths:
      - "ios/**"
      - "scripts/check_ios_architecture_boundaries.py"
      - "scripts/ios_architecture_boundaries_baseline.json"
      - "scripts/check_ios_doc_comments.py"
      - "scripts/validate_ios_test_lane.py"
      - "scripts/check_ios_quality_gates.py"
      - "scripts/ios_quality_gates.json"
      - "scripts/test-ios.sh"
      - ".github/workflows/ios-ci.yml"
  push:
    paths:
      - "ios/**"
      - "scripts/check_ios_architecture_boundaries.py"
      - "scripts/ios_architecture_boundaries_baseline.json"
      - "scripts/check_ios_doc_comments.py"
      - "scripts/validate_ios_test_lane.py"
      - "scripts/check_ios_quality_gates.py"
      - "scripts/ios_quality_gates.json"
      - "scripts/test-ios.sh"
      - ".github/workflows/ios-ci.yml"

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios_quality:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint
        run: swiftlint --config .swiftlint.yml
        working-directory: ios/sideBar
      - name: Doc comment coverage
        run: python scripts/check_ios_doc_comments.py
      - name: Architecture boundaries
        run: python scripts/check_ios_architecture_boundaries.py

  ios_test_matrix:
    needs: ios_quality
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ipad
            label: "iPad Pro 13-inch (M5) iPadOS 26"
            scheme: sideBar
            destination: "platform=iOS Simulator,name=iPad Pro 13-inch (M5),OS=26.2"
            runs_on: macos-26
            include_on_pr: true
            only_testing: sideBarUITests
            skip_testing: sideBarUITests/SideBarUITestsLaunchTests
            retry_tests_on_failure: "YES"
          - id: iphone
            label: "iPhone 17 Pro iOS 26"
            scheme: sideBar
            destination: "platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2"
            runs_on: macos-26
            include_on_pr: true
            skip_testing: sideBarUITests
            retry_tests_on_failure: "YES"
          - id: mac
            label: "macOS 26"
            scheme: sideBarMacTests
            destination: "platform=macOS,arch=arm64"
            runs_on: macos-26
            include_on_pr: false
            only_testing: sideBarTests
            skip_testing: sideBarUITests,ShareExtensionTests
    steps:
      - name: Checkout
        if: ${{ (github.event_name != 'pull_request' || matrix.include_on_pr) && (github.event_name != 'workflow_dispatch' || github.event.inputs.lane == 'all' || github.event.inputs.lane == matrix.id) }}
        uses: actions/checkout@v4
      - name: Cache Swift Package Manager
        if: ${{ (github.event_name != 'pull_request' || matrix.include_on_pr) && (github.event_name != 'workflow_dispatch' || github.event.inputs.lane == 'all' || github.event.inputs.lane == matrix.id) }}
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: ${{ runner.os }}-${{ matrix.runs_on }}-${{ matrix.id }}-spm-${{ hashFiles('ios/sideBar/sideBar.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.runs_on }}-${{ matrix.id }}-spm-
      - name: Validate lane configuration (${{ matrix.label }})
        if: ${{ (github.event_name != 'pull_request' || matrix.include_on_pr) && (github.event_name != 'workflow_dispatch' || github.event.inputs.lane == 'all' || github.event.inputs.lane == matrix.id) }}
        run: |
          python scripts/validate_ios_test_lane.py \
            --project ios/sideBar/sideBar.xcodeproj \
            --scheme "${{ matrix.scheme }}" \
            --destination "${{ matrix.destination }}" \
            --only-testing "${{ matrix.only_testing }}" \
            --skip-testing "${{ matrix.skip_testing }}" \
            --allowed-macos-targets "sideBarTests"
      - name: Cache Xcode DerivedData
        if: ${{ (github.event_name != 'pull_request' || matrix.include_on_pr) && (github.event_name != 'workflow_dispatch' || github.event.inputs.lane == 'all' || github.event.inputs.lane == matrix.id) }}
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/sideBar-*
          key: ${{ runner.os }}-${{ matrix.runs_on }}-${{ matrix.id }}-dd-${{ github.ref_name }}-${{ hashFiles('ios/sideBar/sideBar.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.runs_on }}-${{ matrix.id }}-dd-${{ github.ref_name }}-
            ${{ runner.os }}-${{ matrix.runs_on }}-${{ matrix.id }}-dd-
      - name: Run tests (${{ matrix.label }})
        if: ${{ (github.event_name != 'pull_request' || matrix.include_on_pr) && (github.event_name != 'workflow_dispatch' || github.event.inputs.lane == 'all' || github.event.inputs.lane == matrix.id) }}
        env:
          IOS_SCHEME: ${{ matrix.scheme }}
          IOS_DESTINATION: ${{ matrix.destination }}
          IOS_RESULT_BUNDLE_PATH: ${{ github.workspace }}/ios-test-results/${{ matrix.id }}.xcresult
          IOS_ONLY_TESTING: ${{ matrix.only_testing }}
          IOS_SKIP_TESTING: ${{ matrix.skip_testing }}
          IOS_RETRY_TESTS_ON_FAILURE: ${{ matrix.retry_tests_on_failure }}
        run: scripts/test-ios.sh
      - name: Package xcresult (${{ matrix.id }})
        if: ${{ always() && (github.event_name != 'pull_request' || matrix.include_on_pr) && (github.event_name != 'workflow_dispatch' || github.event.inputs.lane == 'all' || github.event.inputs.lane == matrix.id) }}
        run: |
          bundle_path="ios-test-results/${{ matrix.id }}.xcresult"
          archive_path="ios-test-results/${{ matrix.id }}.xcresult.zip"
          if [[ -d "${bundle_path}" ]]; then
            ditto -c -k --sequesterRsrc --keepParent "${bundle_path}" "${archive_path}"
          else
            echo "No xcresult bundle found at ${bundle_path}; skipping archive."
          fi
      - name: Upload xcresult archive (${{ matrix.id }})
        if: ${{ always() && (github.event_name != 'pull_request' || matrix.include_on_pr) && (github.event_name != 'workflow_dispatch' || github.event.inputs.lane == 'all' || github.event.inputs.lane == matrix.id) }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult-${{ matrix.id }}
          path: ios-test-results/${{ matrix.id }}.xcresult.zip
          if-no-files-found: ignore

  ios_hard_gates:
    needs: ios_test_matrix
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.lane == 'all' || github.event.inputs.lane == 'iphone' }}
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download iPhone xcresult
        uses: actions/download-artifact@v4
        with:
          name: ios-xcresult-iphone
          path: ios-test-results
      - name: Extract iPhone xcresult
        run: |
          ditto -x -k ios-test-results/iphone.xcresult.zip ios-test-results
      - name: Enforce hard quality gates
        run: |
          python scripts/check_ios_quality_gates.py \
            --xcresult ios-test-results/iphone.xcresult \
            --config scripts/ios_quality_gates.json
