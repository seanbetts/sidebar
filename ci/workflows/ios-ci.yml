name: iOS CI (dev)

on:
  push:
    branches: [dev]
    paths:
      - "ios/**"
      - "scripts/check_ios_doc_comments.py"
      - "scripts/check_ios_extension_config_resolution.py"
      - "scripts/check_notes_runtime_boundary.py"
      - ".swiftlint.yml"
      - ".github/workflows/ios-ci.yml"

concurrency:
  group: ios-ci-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios_quality:
    runs-on: [self-hosted, mac]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: SwiftLint
        run: swiftlint --config .swiftlint.yml
        working-directory: ios/sideBar
      - name: Doc comment coverage
        run: python3 scripts/check_ios_doc_comments.py

  ios_test_logic:
    needs: [ios_quality]
    runs-on: [self-hosted, mac]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Resolve packages
        run: |
          xcodebuild -project ios/sideBar/sideBar.xcodeproj \
            -scheme sideBarLogicHost \
            -destination 'platform=macOS' \
            -resolvePackageDependencies \
            -onlyUsePackageVersionsFromResolvedFile
      - name: Run logic tests (macOS, no simulator)
        run: |
          xcodebuild test \
            -project ios/sideBar/sideBar.xcodeproj \
            -scheme sideBarLogicHost \
            -testPlan AppleFast \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=
